name = "trekking"
main = "cloudflare-content-worker.mjs"
compatibility_date = "2026-11-14"
account_id = "c43bec7c84b3419d77c0adb80b2cec1c"
workers_dev = true

[ai]
binding = "AI"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/admin.html"]

[[d1_databases]]
binding = "DB"
database_name = "trekking"
database_id = "fc8aeafe-2154-49ce-a06f-bf1b9562dfa3"
migrations_dir = "migrations"

[[durable_objects.bindings]]
name = "SUBMISSION_HUB"
class_name = "AdminSubmissionHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AdminSubmissionHub"]
